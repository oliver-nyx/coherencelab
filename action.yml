name: CoherenceLab Scan
description: Validate browser identity coherence (TLS, HTTP/2, headers, Client Hints) in CI
author: oliver-nyx
branding:
  icon: shield
  color: blue

inputs:
  profile:
    description: Browser profile ID (e.g. chrome-131-win, chrome-131-ios, opera-116-win)
    required: true
  min-score:
    description: Minimum score percentage required to pass (used with CI mode)
    required: false
    default: "90"
  mode:
    description: Scan mode â€” local, mutate, or live
    required: false
    default: local
  mutate:
    description: Mutation scenario when mode=mutate (wrong-platform, wrong-browser, automation-leak, tls-mismatch)
    required: false
    default: ""
  probe:
    description: Probe URL when mode=live
    required: false
    default: ""
  insecure:
    description: Skip TLS verify for live probes (true/false)
    required: false
    default: "false"
  version:
    description: CoherenceLab release tag or branch to install (ignored when local-source is set)
    required: false
    default: "v1.9.0"
  local-source:
    description: Path to a local CoherenceLab checkout (relative to workspace). Skips git clone â€” use "." when dogfooding this repo.
    required: false
    default: ""
  working-directory:
    description: Working directory for the scan (relative to workspace)
    required: false
    default: "."
  go-version:
    description: Go version used when building from source
    required: false
    default: "1.24"

outputs:
  grade:
    description: Letter grade from the scan (Aâ€“F)
    value: ${{ steps.scan.outputs.grade }}
  score:
    description: Score percentage from the scan
    value: ${{ steps.scan.outputs.score }}

runs:
  using: composite
  steps:
    - name: Resolve CoherenceLab source
      shell: bash
      env:
        INPUT_LOCAL_SOURCE: ${{ inputs.local-source }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_LOCAL_SOURCE" ]]; then
          DEST="${GITHUB_WORKSPACE}/${INPUT_LOCAL_SOURCE}"
          DEST="$(cd "$DEST" && pwd)"
        else
          case "$INPUT_VERSION" in
            v[0-9]*|main|master) ;;
            *)
              echo "Refusing unsafe version value: $INPUT_VERSION" >&2
              exit 1
              ;;
          esac
          DEST="${RUNNER_TEMP}/coherencelab-src"
          rm -rf "$DEST"
          git clone --depth 1 --branch "$INPUT_VERSION" \
            https://github.com/oliver-nyx/coherencelab.git "$DEST"
        fi
        echo "COHERENCELAB_SRC=$DEST" >> "$GITHUB_ENV"
        echo "COHERENCELAB_PROFILES=$DEST/profiles" >> "$GITHUB_ENV"
        echo "Resolved source: $DEST"

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build CoherenceLab
      shell: bash
      run: |
        set -euo pipefail
        cd "$COHERENCELAB_SRC"
        go build -o "$RUNNER_TEMP/coherencelab" ./cmd/coherencelab
        echo "COHERENCELAB_BIN=$RUNNER_TEMP/coherencelab" >> "$GITHUB_ENV"

    - name: Run coherence scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MUTATE: ${{ inputs.mutate }}
        INPUT_PROBE: ${{ inputs.probe }}
        INPUT_INSECURE: ${{ inputs.insecure }}
      run: |
        set -euo pipefail
        case "$INPUT_MODE" in
          local|mutate|live|"") ;;
          *)
            echo "Invalid mode: $INPUT_MODE" >&2
            exit 1
            ;;
        esac
        REPORT="$RUNNER_TEMP/coherencelab-report.json"
        ARGS=(scan --profile "$INPUT_PROFILE" --profiles "$COHERENCELAB_PROFILES" --ci --min-score "$INPUT_MIN_SCORE" --format json -o "$REPORT")
        if [[ -n "$INPUT_MODE" && "$INPUT_MODE" != "local" ]]; then
          ARGS+=(--mode "$INPUT_MODE")
        fi
        if [[ -n "$INPUT_MUTATE" ]]; then
          ARGS+=(--mutate "$INPUT_MUTATE")
        fi
        if [[ -n "$INPUT_PROBE" ]]; then
          ARGS+=(--probe "$INPUT_PROBE")
        fi
        if [[ "$INPUT_INSECURE" == "true" ]]; then
          ARGS+=(--insecure)
        fi

        set +e
        "$COHERENCELAB_BIN" "${ARGS[@]}"
        CODE=$?
        set -e

        if [[ -f "$REPORT" ]]; then
          GRADE=$(REPORT="$REPORT" python3 -c "import json,os; print(json.load(open(os.environ['REPORT']))['result']['grade'])")
          SCORE=$(REPORT="$REPORT" python3 -c "import json,os; print(json.load(open(os.environ['REPORT']))['result']['percentage'])")
          echo "grade=${GRADE}" >> "$GITHUB_OUTPUT"
          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
          {
            echo "### CoherenceLab result"
            echo "- Profile: \`${INPUT_PROFILE}\`"
            echo "- Grade: **${GRADE}**"
            echo "- Score: **${SCORE}%**"
            echo "- Min score: ${INPUT_MIN_SCORE}"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $CODE
