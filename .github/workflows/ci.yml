name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o coherencelab ./cmd/coherencelab

      - name: Validate profiles
        run: ./coherencelab profiles validate --profiles profiles
