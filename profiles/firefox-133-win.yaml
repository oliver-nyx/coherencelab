id: firefox-133-win
name: Mozilla Firefox 133 (Windows)
browser: firefox
version: "133"
platform: windows
engine: gecko
description: >
  Firefox 133 on Windows. Does not send Client Hints — a common mismatch
  when developers copy Chrome headers onto Firefox TLS fingerprints.
tags:
  - firefox
  - windows
  - desktop

user_agent:
  value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0"
  pattern: "Firefox/133.0"
  match_mode: contains
  major: 133
  full_version: "133.0"
  platform: windows
  mobile: false

client_hints:
  sec_ch_ua: ""
  sec_ch_ua_mobile: ""
  sec_ch_ua_platform: ""

headers:
  order:
    - host
    - user-agent
    - accept
    - accept-language
    - accept-encoding
    - connection
    - upgrade-insecure-requests
    - sec-fetch-dest
    - sec-fetch-mode
    - sec-fetch-site
    - sec-fetch-user
  required:
    Sec-Fetch-Site: none
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: "?1"
    Sec-Fetch-Dest: document
  forbidden:
    - Sec-Ch-Ua
    - Sec-Ch-Ua-Mobile
    - Sec-Ch-Ua-Platform
  accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  accept_encoding: "gzip, deflate, br, zstd"
  upgrade_insecure_requests: true

tls:
  min_version: "TLS 1.2"
  max_version: "TLS 1.3"
  alpn:
    - h2
    - http/1.1
  utls_client_id: firefox_133

http2:
  header_table_size: 65536
  enable_push: 0
  max_concurrent_streams: 100
  initial_window_size: 131072
  max_frame_size: 16384
  max_header_list_size: 0

accept_language:
  pattern: "en-US,en;q=0.5"
  primary: en-US

js_runtime:
  navigator:
    platform: Win32
    vendor: ""
    language: en-US
    languages: [en-US, en]
    webdriver: false
    max_touch_points: 0
