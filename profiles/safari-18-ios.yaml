id: safari-18-ios
name: Safari 18 (iOS)
browser: safari
version: "18"
platform: ios
engine: webkit
description: >
  Mobile Safari on iPhone/iPad. No Client Hints, distinct TLS fingerprint,
  and mobile User-Agent patterns.
tags:
  - safari
  - ios
  - mobile

user_agent:
  value: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
  pattern: "Version/18.0 Mobile/15E148 Safari/604.1"
  match_mode: contains
  major: 18
  full_version: "18.0"
  platform: ios
  mobile: true

client_hints:
  sec_ch_ua: ""
  sec_ch_ua_mobile: ""
  sec_ch_ua_platform: ""

headers:
  order:
    - host
    - accept
    - user-agent
    - accept-language
    - accept-encoding
    - connection
  required: {}
  forbidden:
    - Sec-Ch-Ua
    - Sec-Ch-Ua-Mobile
    - Sec-Ch-Ua-Platform
    - Sec-Fetch-Site
  accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  accept_encoding: "gzip, deflate, br"
  upgrade_insecure_requests: false

tls:
  min_version: "TLS 1.2"
  max_version: "TLS 1.3"
  alpn:
    - h2
    - http/1.1
  utls_client_id: safari_ios_18

http2:
  header_table_size: 4096
  enable_push: 0
  max_concurrent_streams: 100
  initial_window_size: 2097152
  max_frame_size: 16384
  max_header_list_size: 0

accept_language:
  pattern: "en-US,en;q=0.9"
  primary: en-US
