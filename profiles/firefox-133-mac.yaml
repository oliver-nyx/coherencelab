id: firefox-133-mac
name: Mozilla Firefox 133 (macOS)
browser: firefox
version: "133"
platform: macos
engine: gecko
description: Firefox 133 on macOS — no Client Hints, Gecko TLS fingerprint.
tags:
  - firefox
  - macos
  - desktop

user_agent:
  value: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:133.0) Gecko/20100101 Firefox/133.0"
  pattern: "Firefox/133.0"
  match_mode: contains
  major: 133
  full_version: "133.0"
  platform: macos
  mobile: false

client_hints:
  sec_ch_ua: ""
  sec_ch_ua_mobile: ""
  sec_ch_ua_platform: ""

headers:
  order:
    - host
    - user-agent
    - accept
    - accept-language
    - accept-encoding
    - connection
    - upgrade-insecure-requests
    - sec-fetch-dest
    - sec-fetch-mode
    - sec-fetch-site
    - sec-fetch-user
  required:
    Sec-Fetch-Site: none
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: "?1"
    Sec-Fetch-Dest: document
  forbidden:
    - Sec-Ch-Ua
    - Sec-Ch-Ua-Mobile
    - Sec-Ch-Ua-Platform
  accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  accept_encoding: "gzip, deflate, br, zstd"
  upgrade_insecure_requests: true

tls:
  min_version: "TLS 1.2"
  max_version: "TLS 1.3"
  alpn:
    - h2
    - http/1.1
  utls_client_id: firefox_133

http2:
  header_table_size: 65536
  enable_push: 0
  max_concurrent_streams: 100
  initial_window_size: 131072
  max_frame_size: 16384
  max_header_list_size: 0

accept_language:
  pattern: "en-US,en;q=0.5"
  primary: en-US
